[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-table-verifier"
version = "0.2.0rc1"
description = "Offline-reproducible financial-table research tools and preserved INSPIRE CSV methods"
readme = "README.md"
authors = [{name = "Raghavendranath Kandula"}]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "pypdfium2>=4.30,<6", "Pillow>=10.4,<13"]

[project.optional-dependencies]
html = ["apted==1.0.3", "distance==0.1.3", "lxml>=5,<7", "tqdm>=4.66,<5"]
build = ["build>=1.2,<2", "wheel>=0.44"]

[project.scripts]
ftv = "financial_table_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["financial_table_verifier"]
namespaces = false

[tool.setuptools.package-data]
financial_table_verifier = ["paper_runtime/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
